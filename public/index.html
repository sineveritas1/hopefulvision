*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;

html,body{width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none}

.hud b{color:rgba(255,240,200,.72);font-weight:700}
#snd{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;

#snd button{background:transparent;border:1px solid rgba(244,236,218,.42);

#snd button.off .slash{opacity:1}
/* Words off hides the overlay outright; the cycle keeps running but paints

#glyph.hushed{display:none}
#glyph{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;

#glyph span{font-family:"Courier Prime",monospace;font-weight:700;font-size:clamp(18px,5.2vw,29px);line-height:1.5;max-width:15em;

  opacity:0;transform:translateY(9px) scale(1.02);
  text-shadow:0 0 46px rgba(0,0,0,.96),0 0 15px rgba(0,0,0,.9),0 0 30px rgba(255,238,205,.16);
  transition:opacity 5s ease,transform 10s ease;
  will-change:opacity,transform;backface-visibility:hidden}
#glyph span.on{opacity:1;transform:translateY(0) scale(1)}
#glyph span i{display:block;margin-top:16px;font-style:normal;font-size:.70em;
  line-height:1.5;color:rgba(255,248,232,.62)}
/* The gate scrolls if it must, but #gwrap carries margin:auto so that a tall
   stack stays centred without the top being clipped, which is what happens to
   an overflowing flex child under justify-content:center. */
#gate{position:fixed;inset:0;z-index:20;background:#000;display:flex;
  align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));
  text-align:center;font-family:"Courier Prime",monospace;color:#EDE6D5}
#gwrap{display:flex;flex-direction:column;align-items:center;width:100%;margin:auto;
  gap:clamp(13px,2.6vh,24px)}
#gate h1{font-family:"Saira Condensed",sans-serif;font-weight:900;
  font-size:clamp(40px,13vw,80px);line-height:.86;text-transform:uppercase;margin:0}
#gate h1 small{display:block;font-size:.38em;letter-spacing:.18em;color:#BCA9F0;margin-top:14px}
#hint{margin:0;max-width:20em;font-size:clamp(15px,4.2vw,18px);line-height:1.6;
  letter-spacing:.04em;color:rgba(237,230,213,.62)}
#hint b{color:rgba(255,248,232,.88);font-weight:400}
/* The global canvas rule above pins every canvas to position:fixed;inset:0 for
   the fullscreen sim. The logo must opt out of that or it leaves the flex flow
   and floats at the top of the viewport, overlapping the title — which is also
   why its old margin-bottom did nothing. In flow, growing it genuinely pushes
   the rest of the stack down. */
/* No filter here on purpose. A drop-shadow glows in ONE fixed colour whatever
   the lines are actually doing, and spreads it across ~130px of background, so
   the black stops being black. The tesseract's glow belongs to the tesseract:
   the fragment shader's own halo (exp(-m*26.0)) already emits in each line's
   current colour and falls off tightly. Do not add a filter back. */
#logo{position:static;width:min(76vw,300px);height:auto;aspect-ratio:1;display:block;
  flex:0 0 auto;margin:0 auto clamp(2px,1.2vh,14px);touch-action:none;cursor:grab}

  border:3px solid #D14A33;padding:17px 54px;cursor:pointer;min-height:60px}

<script>
const cv=document.getElementById('c');
const GLOPT={alpha:false,antialias:false,preserveDrawingBuffer:false};
// Ask for the discrete GPU first, then accept whatever is going. A browser that
// has just killed its GPU process refuses the first form but sometimes allows
// the second.
const gl=cv.getContext('webgl2',Object.assign({powerPreference:'high-performance'},GLOPT))
       ||cv.getContext('webgl2',GLOPT);
if(!gl){
  // The old copy here just said "This needs WebGL2." — a dead end that is
  // actively misleading in the common case, which is not an old browser but a
  // browser that killed its own GPU process and will not restart it for this
  // tab. Reloading cannot fix that; only restarting the browser can.
  document.getElementById('gate').innerHTML=
    '<div style="font-family:\'Courier Prime\',monospace;color:#EDE6D5;max-width:24em;'
   +'line-height:1.6;text-align:center;padding:24px">'
   +'<p style="font-size:17px;margin-bottom:16px">The graphics could not start.</p>'
   +'<p style="font-size:13px;opacity:.72;margin-bottom:12px">If this was working a moment ago, '
   +'the browser shut its GPU down and will not bring it back for this tab. '
   +'<b>Reloading will not help — fully quit the browser and reopen it.</b></p>'
   +'<p style="font-size:13px;opacity:.72;margin-bottom:24px">Otherwise this device or browser '
   +'has no WebGL2.</p>'
   +'<button id="retry" style="font-family:\'Saira Condensed\',sans-serif;font-weight:900;'
   +'font-size:19px;letter-spacing:.16em;text-transform:uppercase;background:#9E2A1A;color:#FFF3DC;'
   +'border:3px solid #D14A33;padding:13px 34px;cursor:pointer">Try again</button></div>';
  const rb=document.getElementById('retry');
  if(rb) rb.onclick=function(){ location.reload(); };
}

const SIDE = Math.min(innerWidth,innerHeight) < 500 ? 384 : 512;
const N = SIDE*SIDE;

const QUAD=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const NOISE=`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))
        +i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm3(vec3 p){ return snoise(p)*0.58+snoise(p*2.03+11.0)*0.27+snoise(p*4.11+31.0)*0.15; }`;

const SPECTRAL=`
vec3 spectral(float w){
  vec3 c;
  if(w<440.0)      c=vec3(-(w-440.0)/60.0,0.0,1.0);
  else if(w<490.0) c=vec3(0.0,(w-440.0)/50.0,1.0);
  else if(w<510.0) c=vec3(0.0,1.0,-(w-510.0)/20.0);
  else if(w<580.0) c=vec3((w-510.0)/70.0,1.0,0.0);
  else if(w<645.0) c=vec3(1.0,-(w-645.0)/65.0,0.0);
  else             c=vec3(1.0,0.0,0.0);
  float f=1.0;
  if(w<420.0) f=0.30+0.70*(w-380.0)/40.0;
  if(w>700.0) f=0.30+0.70*(720.0-w)/20.0;
  return pow(clamp(c*f,0.0,1.0),vec3(0.85));
}`;

const SIM=`#version 300 es
precision highp float;
uniform sampler2D uPos, uVel;
uniform float uT, uDt, uAspect;
uniform vec3  uPtr[10];
uniform float uPtrN;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;
${NOISE}

vec2 curl(vec2 p, float t){
  float e=0.055;
  return vec2( fbm3(vec3(p.x,p.y+e,t))-fbm3(vec3(p.x,p.y-e,t)),
             -(fbm3(vec3(p.x+e,p.y,t))-fbm3(vec3(p.x-e,p.y,t))) )/(2.0*e);
}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

void main(){
  ivec2 ij=ivec2(gl_FragCoord.xy);
  vec4 s=texelFetch(uPos,ij,0);
  vec4 q=texelFetch(uVel,ij,0);
  vec2 pos=s.xy; float age=s.z, seed=s.w;
  vec2 vel=q.xy; float heat=q.z;

  vec2 target = curl(pos*0.38, uT*0.0135)*0.050              + curl(pos*1.05+17.0, uT*0.026)*0.013;
  float gain=0.0;
  for(int i=0;i<10;i++){
    if(float(i)>=uPtrN) break;
    vec3 P=uPtr[i]; if(P.z<=0.0) continue;
    vec2 d=pos-P.xy; float dl=length(d)+1e-5;

    float reach=2.0+5.2*(1.0-P.z);
    float f=exp(-dl*reach);
    float pw=0.16+1.35*P.z*P.z;
    vec2 tang=vec2(-d.y,d.x)/dl;
    target += tang*f*pw*2.30;    target += curl(pos*3.4+float(i)*9.0, uT*0.11)*f*pw*1.25;    target -= d/dl*f*pw*0.10;    gain   += f*pw;
  }

  heat += gain*uDt*2.6;
  heat *= exp(-uDt*0.20);  heat  = min(heat,1.5);

  vel = mix(vel, target, 1.0-exp(-uDt*1.25));

  pos += vel*uDt;
  age += uDt*(0.0165+0.013*seed);

  if(age>1.0 || abs(pos.x)>uAspect*1.35 || abs(pos.y)>1.35){
    float k=hash(vec2(seed*137.0, floor(uT*0.37)+float(ij.x*7+ij.y)));
    float a=hash(vec2(k,3.1))*6.2831, r=sqrt(hash(vec2(k,7.7)))*1.15;
    pos=vec2(cos(a)*r*uAspect, sin(a)*r);
    age=hash(vec2(k,9.3))*0.25; vel=vec2(0.0); heat=0.0;
  }
  oPos=vec4(pos,age,seed);
  oVel=vec4(vel,heat,0.0);
}`;

const PVS=`#version 300 es
precision highp float;
uniform sampler2D uPos, uVel;
uniform float uSide, uAspect, uT, uPx;
out vec4 vCol;
${NOISE}
${SPECTRAL}
void main(){
  int side=int(uSide);
  ivec2 ij=ivec2(gl_VertexID%side, gl_VertexID/side);
  vec4 s=texelFetch(uPos,ij,0);
  vec4 q=texelFetch(uVel,ij,0);
  vec2 pos=s.xy; float age=s.z, seed=s.w, heat=q.z;

  gl_Position=vec4(pos.x/uAspect,pos.y,0.0,1.0);

  float band=fbm3(vec3(pos*0.30, uT*0.0062+seed*0.05));
  float base=fract(band*0.5+0.5+seed*0.07+uT*0.0011);
  float w=398.0+306.0*pow(fract(base+heat*0.78),1.22);

  float fade=sin(3.14159*clamp(age,0.0,1.0));
  float glow=1.0+2.2*heat;
  vCol=vec4(spectral(w), fade*(0.22+0.40*seed)*glow);
  gl_PointSize=uPx*(0.75+1.35*seed)*(0.55+0.75*fade)*(1.0+1.5*heat);
}`;

const PFS=`#version 300 es
precision highp float;
in vec4 vCol; out vec4 o;
void main(){
  vec2 d=gl_PointCoord-0.5;
  float r=dot(d,d)*4.0;
  if(r>1.0) discard;
  o=vec4(vCol.rgb*vCol.a*pow(1.0-r,2.4)*0.24,1.0);
}`;

const RVS=`#version 300 es
precision highp float;
uniform vec3 uPtr[10]; uniform float uSd[10]; uniform float uAspect, uPxScale, uTv;
out float vP; flat out int vI; out float vH;
void main(){
  vec3 P=uPtr[gl_VertexID];
  gl_Position=vec4(P.x/uAspect,P.y,0.0,1.0);
  gl_PointSize=uPxScale*(96.0+300.0*P.z);
  vP=P.z; vI=gl_VertexID;
  vH=fract(uSd[gl_VertexID]+uTv*0.082+0.22*P.z);
}`;
const RFS=`#version 300 es
precision highp float;
in float vP; flat in int vI; in float vH; uniform float uT; out vec4 o;
${SPECTRAL}
void main(){
  vec2 d=gl_PointCoord-0.5;
  float r=length(d)*2.0;
  if(r>1.0) discard;

  float core = exp(-pow(r/0.17,2.0)) * 4.2;
  float spill= exp(-pow(r/0.44,2.0)) * 1.55;

  float a1=exp(-pow((r-0.55-0.07*sin(uT*0.83+float(vI)))/0.17,2.0))*1.5;
  float a2=exp(-pow((r-0.84-0.05*sin(uT*0.51+1.7+float(vI)))/0.11,2.0))*0.85;

  float amp=(core+spill+a1+a2)*(0.52+0.80*vP);

  float w=398.0+306.0*pow(fract(vH),1.20);
  o=vec4(spectral(w)*amp*0.95,1.0);
}`;

const FADE=`#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes; uniform float uK;
out vec4 o;
void main(){
  vec2 uv=gl_FragCoord.xy/uRes; vec2 e=1.4/uRes;
  vec3 c=texture(uSrc,uv).rgb*0.56;
  c+=texture(uSrc,uv+vec2( e.x,0)).rgb*0.11;
  c+=texture(uSrc,uv+vec2(-e.x,0)).rgb*0.11;
  c+=texture(uSrc,uv+vec2(0, e.y)).rgb*0.11;
  c+=texture(uSrc,uv+vec2(0,-e.y)).rgb*0.11;
  o=vec4(c*uK,1.0);
}`;

const POST=`#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uRes; uniform float uT;
out vec4 o;
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  vec3 c=texture(uSrc,uv).rgb;

  float mn=min(min(c.r,c.g),c.b);
  c-=mn*0.72;
  float mx=max(max(c.r,c.g),c.b);
  vec3 hue=c/max(mx,1e-4);  hue=pow(hue,vec3(1.30,1.24,1.05));
  float i=mx/(1.0+mx*0.85);  i=min(i,0.86);
  c=hue*i;

  float d=length(uv-0.5);
  c*=1.0-0.44*pow(d*1.3,2.4);
  float g=fract(sin(dot(gl_FragCoord.xy+uT,vec2(12.9898,78.233)))*43758.5453);
  c+=(g-0.5)*0.018;
  o=vec4(pow(clamp(c,0.0,1.0),vec3(0.4545)),1.0);
}`;

function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
function prog(vs,fs){const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));return p;}

gl.getExtension('EXT_color_buffer_float');
const pSim=prog(QUAD,SIM), pPart=prog(PVS,PFS), pRing=prog(RVS,RFS),
      pFade=prog(QUAD,FADE), pPost=prog(QUAD,POST);

const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const vao=gl.createVertexArray();
function bindQuad(p){gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  const l=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);}

function dataTex(w,h,data){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,w,h,0,gl.RGBA,gl.FLOAT,data);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function colorTex(w,h){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  return [t,f];
}

let AR=1,W,H; const DPR=Math.min(devicePixelRatio||1,1.75);
const iP=new Float32Array(N*4), iV=new Float32Array(N*4);
let posT=[],velT=[],simF=[],pcur=0, acc=[],accF=[],accCur=0;

/* Startup and resize are deliberately separate.
   Particle state lives in SIDE x SIDE textures whose size has nothing to do
   with the window, so it is seeded once and a resize never touches it. Only
   the accumulation buffers have to match the canvas.
   These were previously one routine run on every resize, which re-randomised
   all 262144 particles, re-uploaded 16MB of float textures and cleared the
   trails. A 1px height change was enough to trigger it -- which is exactly what
   an iOS toolbar sliding in and out does, repeatedly, mid-session. */
function seed(){
  for(let i=0;i<N;i++){
    const a=Math.random()*6.2831,r=Math.sqrt(Math.random())*1.1;
    iP[i*4]=Math.cos(a)*r*AR; iP[i*4+1]=Math.sin(a)*r;
    iP[i*4+2]=Math.random(); iP[i*4+3]=Math.random();
  }
  for(let i=0;i<2;i++){
    posT.push(dataTex(SIDE,SIDE,iP));
    velT.push(dataTex(SIDE,SIDE,iV));
    const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,posT[i],0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT1,gl.TEXTURE_2D,velT[i],0);
    simF.push(f);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

function sizeTargets(){
  const nw=Math.floor(innerWidth*DPR), nh=Math.floor(innerHeight*DPR);
  if(nw===W&&nh===H) return;                 // nothing actually changed
  const old=acc.length?acc[accCur]:null;
  W=nw;H=nh; cv.width=W;cv.height=H;AR=W/H;

  const nT=[],nF=[];
  for(let i=0;i<2;i++){const [t,f]=colorTex(W,H);nT.push(t);nF.push(f);
    gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);}

  // Carry the existing trails into the new buffers, so a toolbar sliding in
  // and out is invisible instead of wiping the painting. uK=1 makes the fade
  // shader a straight copy; LINEAR sampling rescales it.
  if(old){
    gl.useProgram(pFade); bindQuad(pFade);
    gl.bindFramebuffer(gl.FRAMEBUFFER,nF[0]);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
    gl.viewport(0,0,W,H);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,old);
    gl.uniform1i(gl.getUniformLocation(pFade,'uSrc'),0);
    gl.uniform2f(gl.getUniformLocation(pFade,'uRes'),W,H);
    gl.uniform1f(gl.getUniformLocation(pFade,'uK'),1.0);
    gl.disable(gl.BLEND);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  acc.forEach(t=>gl.deleteTexture(t)); accF.forEach(f=>gl.deleteFramebuffer(f));
  acc=nT; accF=nF; accCur=0;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
addEventListener('resize',()=>{clearTimeout(window.__r);window.__r=setTimeout(sizeTargets,220);});

const ptrs=new Map();
function raw(e){
  let p=e.pressure;
  const area=Math.max(e.width||0,e.height||0);
  if(p!==undefined && p>0 && Math.abs(p-0.5)>0.02) return Math.min(1,p);
  if(area>1) return Math.min(1,area/54);
  return null;}
function pdata(e,prev){
  const r=raw(e);
  const now=performance.now();
  let p;
  if(r!==null){ p=r; }
  else {
    const dx=prev?(e.clientX-prev.cx):0, dy=prev?(e.clientY-prev.cy):0;
    const dist=Math.hypot(dx,dy);
    const base=prev?prev.p:0.18;
    const rise=dist<3 ? 0.055 : -Math.min(0.30,dist*0.014);
    p=Math.max(0.10,Math.min(1,base+rise));
  }
  return { x:(e.clientX/innerWidth-0.5)*2*AR, y:-(e.clientY/innerHeight-0.5)*2,
           p, cx:e.clientX, cy:e.clientY, t:now,
           s: prev ? prev.s : Math.random() };
}
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,pdata(e,null));
  Bath.note(e.clientX/innerWidth, e.clientY/innerHeight);});
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,pdata(e,ptrs.get(e.pointerId)));});

const U=(p,names)=>{const o={};names.forEach(n=>o[n]=gl.getUniformLocation(p,n));return o;};
const uS=U(pSim,['uPos','uVel','uT','uDt','uAspect','uPtr','uPtrN']);
const uP=U(pPart,['uPos','uVel','uSide','uAspect','uT','uPx']);
const uR=U(pRing,['uPtr','uSd','uAspect','uPxScale','uT','uTv']);
const uF=U(pFade,['uSrc','uRes','uK']);
const uO=U(pPost,['uSrc','uRes','uT']);

let t0=performance.now(),last=t0,running=false;

/* A lost context is the difference between a blip and a dead page.
   Without preventDefault() the browser never even attempts to restore it, so
   the canvas stays blank until a reload — and if the GPU process is what died,
   the reload comes back with no webgl2 at all and the message above. */
cv.addEventListener('webglcontextlost',function(e){
  e.preventDefault();
  running=false;
  const g=document.getElementById('gtext');
  if(g){ g.classList.remove('on'); g.textContent='one moment'; requestAnimationFrame(function(){g.classList.add('on');}); }
},false);
cv.addEventListener('webglcontextrestored',function(){
  // Every program, buffer and texture died with the context. Reloading rebuilds
  // them correctly; reusing the old handles would draw nothing.
  location.reload();
},false);

/* Adaptive guard. Particle sprites grow with "heat", and heat is injected by
   every pointer, so ten fingers held down inflate a large fraction of the
   262144 sprites at once and the fill rate climbs steeply. A phone GPU that
   misses its watchdog deadline gets its context killed by the driver, which is
   the crash this is here to avoid.
   q stays at 1 and nothing changes on hardware that keeps up; it only backs off
   after ~45 sustained slow frames, and creeps back up as soon as they recover. */
let slowN=0, q=1;
const MRT=[gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1];

function frame(now){
  if(!running) return;
  const t=(now-t0)/1000, dt=Math.min(0.05,(now-last)/1000), ms=now-last; last=now;
  // Frame cost here is dominated by particle sprite AREA, and sprite size scales
  // with "heat" — which has a five second time constant (exp(-uDt*0.20) in the
  // sim shader). So a sustained press does not load the GPU all at once: it
  // keeps inflating every sprite for ten to fifteen seconds, growing area by up
  // to 10.6x, before plateauing. That ramp is the ~11s freeze — the load crosses
  // what the device can hold and frames stretch into hundreds of milliseconds.
  //
  // Reacting to a RUN of slow frames cannot help with that: at 200ms a frame,
  // waiting for 45 of them takes nine seconds, which IS the freeze. One bad
  // frame now cuts q straight away, and recovery is deliberately slow so it
  // settles instead of oscillating around the threshold.
  if(ms>100){ q=Math.max(0.35,q*0.65); slowN=0; }
  else if(ms>34){ if(++slowN>=12){ q=Math.max(0.35,q-0.10); slowN=0; } }
  else { if(slowN>0) slowN--; else if(q<1) q=Math.min(1,q+0.0010); }

  const arr=new Float32Array(30), sds=new Float32Array(10); let n=0,mx=0;
  ptrs.forEach(v=>{ if(n<10){arr[n*3]=v.x;arr[n*3+1]=v.y;arr[n*3+2]=v.p;sds[n]=v.s;n++;mx=Math.max(mx,v.p);} });

  gl.useProgram(pSim); bindQuad(pSim);
  gl.bindFramebuffer(gl.FRAMEBUFFER,simF[1-pcur]);
  gl.drawBuffers(MRT);
  gl.viewport(0,0,SIDE,SIDE);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,posT[pcur]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,velT[pcur]);
  gl.uniform1i(uS.uPos,0); gl.uniform1i(uS.uVel,1);
  gl.uniform1f(uS.uT,t); gl.uniform1f(uS.uDt,dt); gl.uniform1f(uS.uAspect,AR);
  gl.uniform3fv(uS.uPtr,arr); gl.uniform1f(uS.uPtrN,n);
  gl.disable(gl.BLEND); gl.drawArrays(gl.TRIANGLES,0,3);
  pcur=1-pcur;

  gl.useProgram(pFade); bindQuad(pFade);
  gl.bindFramebuffer(gl.FRAMEBUFFER,accF[1-accCur]);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,acc[accCur]);
  gl.uniform1i(uF.uSrc,0); gl.uniform2f(uF.uRes,W,H); gl.uniform1f(uF.uK,0.9938);
  gl.drawArrays(gl.TRIANGLES,0,3);
  accCur=1-accCur;

  gl.bindFramebuffer(gl.FRAMEBUFFER,accF[accCur]);
  gl.viewport(0,0,W,H);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.bindVertexArray(vao);

  gl.useProgram(pPart);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,posT[pcur]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,velT[pcur]);
  gl.uniform1i(uP.uPos,0); gl.uniform1i(uP.uVel,1);
  gl.uniform1f(uP.uSide,SIDE); gl.uniform1f(uP.uAspect,AR);
  gl.uniform1f(uP.uT,t); gl.uniform1f(uP.uPx,2.1*DPR*q);
  gl.drawArrays(gl.POINTS,0,N);

  if(n>0){
    gl.useProgram(pRing);
    gl.uniform3fv(uR.uPtr,arr); gl.uniform1fv(uR.uSd,sds);
    gl.uniform1f(uR.uAspect,AR); gl.uniform1f(uR.uPxScale,DPR);
    gl.uniform1f(uR.uT,t); gl.uniform1f(uR.uTv,t);
    gl.drawArrays(gl.POINTS,0,n);
  }
  gl.bindVertexArray(null); gl.disable(gl.BLEND);

  gl.useProgram(pPost); bindQuad(pPost);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,acc[accCur]);
  gl.uniform1i(uO.uSrc,0); gl.uniform2f(uO.uRes,W,H); gl.uniform1f(uO.uT,t);
  gl.drawArrays(gl.TRIANGLES,0,3);

  requestAnimationFrame(frame);
}

(function(){
  const lc=document.getElementById('logo');
  const lg=lc.getContext('webgl',{alpha:true,premultipliedAlpha:false});
  if(!lg){ lc.style.display='none'; return; }

  const LVS='attribute vec2 p;varying vec2 v;void main(){v=p*0.5+0.5;gl_Position=vec4(p,0.,1.);}';
  const LFS=`
precision highp float;
varying vec2 v;
uniform vec4 uSeg[32];
uniform float uT, uHeat, uOn;
uniform vec2 uP;

vec3 spectral(float w){
  vec3 c;
  if(w<440.0)      c=vec3(-(w-440.0)/60.0,0.0,1.0);
  else if(w<490.0) c=vec3(0.0,(w-440.0)/50.0,1.0);
  else if(w<510.0) c=vec3(0.0,1.0,-(w-510.0)/20.0);
  else if(w<580.0) c=vec3((w-510.0)/70.0,1.0,0.0);
  else if(w<645.0) c=vec3(1.0,-(w-645.0)/65.0,0.0);
  else             c=vec3(1.0,0.0,0.0);
  float f=1.0;
  if(w<420.0) f=0.30+0.70*(w-380.0)/40.0;
  if(w>700.0) f=0.30+0.70*(720.0-w)/20.0;
  return pow(clamp(c*f,0.0,1.0),vec3(0.85));
}
float band2w(float x){
  x=fract(x);
  return x<0.56 ? 402.0+(543.0-402.0)*(x/0.56)
                : 608.0+(702.0-608.0)*((x-0.56)/0.44);
}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p*=2.03;p+=1.7;a*=.5;}return s;}

float segd(vec2 p, vec2 a, vec2 b){
  vec2 pa=p-a, ba=b-a;
  float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.0,1.0);
  return length(pa-ba*h);
}

void main(){
  vec2 uv=v;
  float t=uT*0.235;

  vec2 q=vec2(fbm(uv*3.1+t), fbm(uv*3.1+vec2(5.2,1.3)-t));
  vec2 r=vec2(fbm(uv*4.4+2.0*q+t*0.7), fbm(uv*4.4+2.0*q+vec2(8.3,2.8)));

  vec2 d=uv-uP;
  float dl=length(d)+1e-4;
  float push=exp(-dl*5.0)*uOn;

  vec2 bend=vec2(fbm(uv*1.15+t*0.5), fbm(uv*1.15+vec2(4.1,2.7)-t*0.4));
  vec2 guv=uv+(bend-0.5)*(0.010+0.016*uHeat);
  guv+=normalize(d)*push*0.030;
  guv=uP+mat2(cos(push*0.62),-sin(push*0.62),sin(push*0.62),cos(push*0.62))*(guv-uP);

  vec2 wuv=uv+(r-0.5)*(0.026+0.048*uHeat);

  float m=1e9;
  for(int i=0;i<32;i++){
    vec4 S=uSeg[i];
    m=min(m, segd(guv, S.xy, S.zw));
  }

  float core=1.0-smoothstep(0.0,0.0085,m);
  float halo=exp(-m*26.0);
  float mask=clamp(core+halo*0.62,0.0,1.0);
  if(mask<0.006) discard;

  float band=fbm(wuv*2.3+vec2(t*1.7,-t*1.1))+push*0.6+uHeat*0.4+m*3.4;
  vec3 col =spectral(band2w(band*0.95+uT*0.055));
  vec3 col2=spectral(band2w(band*0.48-uT*0.026+0.5));
  col=mix(col,col2,0.42+0.30*sin(uT*0.62+band*3.0));
  col*=0.62+0.85*core+1.1*push;

  gl_FragColor=vec4(col*mask,mask);
}`;

  function csh(t,src){const x=lg.createShader(t);lg.shaderSource(x,src);lg.compileShader(x);return x;}
  const pr=lg.createProgram();
  lg.attachShader(pr,csh(lg.VERTEX_SHADER,LVS));
  lg.attachShader(pr,csh(lg.FRAGMENT_SHADER,LFS));
  lg.linkProgram(pr); lg.useProgram(pr);

  const b=lg.createBuffer();
  lg.bindBuffer(lg.ARRAY_BUFFER,b);
  lg.bufferData(lg.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),lg.STATIC_DRAW);
  const la=lg.getAttribLocation(pr,'p');
  lg.enableVertexAttribArray(la); lg.vertexAttribPointer(la,2,lg.FLOAT,false,0,0);

  const uSeg=lg.getUniformLocation(pr,'uSeg'), uT=lg.getUniformLocation(pr,'uT'),
        uHeat=lg.getUniformLocation(pr,'uHeat'), uP=lg.getUniformLocation(pr,'uP'),
        uOn=lg.getUniformLocation(pr,'uOn');

  lg.enable(lg.BLEND);
  lg.blendFunc(lg.ONE,lg.ONE_MINUS_SRC_ALPHA);
  lg.clearColor(0,0,0,0);

  const V=[];
  for(let i=0;i<16;i++) V.push([(i&1)?1:-1,(i&2)?1:-1,(i&4)?1:-1,(i&8)?1:-1]);
  const E=[];
  for(let i=0;i<16;i++) for(let k=0;k<4;k++){ const j=i^(1<<k); if(j>i) E.push([i,j]); }

  const seg=new Float32Array(32*4);
  function turn(p,i,j,ang){
    const c=Math.cos(ang),s=Math.sin(ang),x=p[i],y=p[j];
    p[i]=x*c-y*s; p[j]=x*s+y*c;
  }
  function project(t){
    const P=[];
    for(let n=0;n<16;n++){
      const p=V[n].slice();
      turn(p,0,3,t*0.31);
      turn(p,1,2,t*0.24);
      turn(p,0,1,t*0.13);
      turn(p,2,3,t*0.19);
      const k4=1.9/(2.9-p[3]);
      let x=p[0]*k4, y=p[1]*k4, z=p[2]*k4;
      const k3=1.75/(3.4-z);
      P.push([0.5+x*k3*0.30, 0.5+y*k3*0.30]);
    }
    for(let e=0;e<32;e++){
      const A=P[E[e][0]], B=P[E[e][1]];
      seg[e*4]=A[0]; seg[e*4+1]=A[1]; seg[e*4+2]=B[0]; seg[e*4+3]=B[1];
    }
  }

  // px/py follow tx/ty rather than snapping to the pointer, so the deformation
  // trails the finger like a fluid instead of teleporting with it.
  let px=0.5,py=0.5,tx=0.5,ty=0.5,on=0,heat=0,held=false,hoverUntil=0;
  function at(e){
    const rc=lc.getBoundingClientRect(); if(!rc.width) return;
    tx=(e.clientX-rc.left)/rc.width;
    ty=1.0-(e.clientY-rc.top)/rc.height;
  }
  lc.addEventListener('pointerdown',e=>{
    held=true; at(e);
    try{ lc.setPointerCapture(e.pointerId); }catch(_){}
  });
  // Hover used to shove `on` up with Math.max every move, which fought the
  // easing and jittered. A decaying deadline lets it ease both ways instead.
  lc.addEventListener('pointermove',e=>{ at(e); if(!held) hoverUntil=performance.now()+420; });
  ['pointerup','pointercancel','lostpointercapture'].forEach(k=>
    lc.addEventListener(k,()=>held=false));

  // Match the backing store to the element's real pixel size. The logo is much
  // larger now, and a fixed 560px canvas upscaled on a 3x phone screen is soft.
  function sizeLogo(){
    const r=lc.getBoundingClientRect(); if(!r.width) return;
    const px2=Math.max(1,Math.round(r.width*Math.min(devicePixelRatio||1,2.5)));
    if(lc.width!==px2){ lc.width=px2; lc.height=px2; }
  }
  sizeLogo();
  addEventListener('resize',()=>{clearTimeout(window.__lr);window.__lr=setTimeout(sizeLogo,180);});
  // The gate is laid out with a webfont; re-measure once it lands.
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(sizeLogo).catch(()=>{});
  setTimeout(sizeLogo,600); setTimeout(sizeLogo,2000);

  // Rotation is INTEGRATED as a phase, not derived from absolute time.
  //
  // The old form was project(t*(1.0+0.55*on)) — it scaled elapsed time by the
  // interaction amount, so the angle depended on a number that grows all
  // session. Easing `on` from 0 to 1 at t=100s swept the argument from 100 to
  // 155, i.e. ~17 radians of extra rotation dumped into half a second. That is
  // the spin-out: it got worse the longer the page had been open, which is why
  // it seemed to happen only sometimes.
  //
  // Integrating means touch changes the RATE and never the accumulated angle,
  // so it can only ever speed up smoothly. dt is clamped for the same reason:
  // a backgrounded tab must not bank up seconds of rotation and spend them in
  // one frame on return.
  const T0=performance.now();
  let phase=0,last=T0;
  (function tick(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    const t=(now-T0)/1000;

    // Frame-rate independent easing, matching the main sim's 1-exp(-dt*k) idiom,
    // so a 120Hz iPhone converges at the same speed as a 60Hz display.
    const target = held ? 1 : (now<hoverUntil ? 0.30 : 0);
    on   += (target-on)       * (1-Math.exp(-dt*9));
    heat += ((held?1:0)-heat) * (1-Math.exp(-dt*2.4));
    px   += (tx-px)           * (1-Math.exp(-dt*13));
    py   += (ty-py)           * (1-Math.exp(-dt*13));

    phase += dt*(1.0+0.55*on);
    project(phase);

    lg.viewport(0,0,lc.width,lc.height);
    lg.clear(lg.COLOR_BUFFER_BIT);
    lg.useProgram(pr);
    lg.uniform4fv(uSeg,seg);
    lg.uniform1f(uT,t); lg.uniform1f(uHeat,heat); lg.uniform1f(uOn,on);
    lg.uniform2f(uP,px,py);
    lg.drawArrays(lg.TRIANGLES,0,3);
    requestAnimationFrame(tick);
  })(performance.now());
})();


const Bath=(function(){
  // One fixed output level. There is no in-page volume: the device's volume is
  // the volume, and the corner bell is only a mute.
  const LEVEL=0.5, WET=0.46;

  let ctx,master,comp,verb,wet,started=false,muted=false;

  function impulse(sec,decay){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){
      const d=b.getChannelData(c);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
    }
    return b;
  }
  function out(node){ node.connect(master); node.connect(verb); }
  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

  /* ---------------------------------------------------------------------
     One note per touch, from C major pentatonic across three octaves.

     The pentatonic set is the entire safety argument. It contains no semitone
     and no tritone, so ANY two of these notes sounded together are consonant —
     which matters here far more than it would for a keyboard, because a bowl
     rings for the better part of ten seconds and consecutive touches always
     overlap. Whatever anyone taps, however fast, the notes still ringing from
     a moment ago cannot clash with the one just struck.

     Adding a note outside this set breaks that guarantee. C D E G A only.
  --------------------------------------------------------------------- */
  const SCALE=[48,50,52,55,57, 60,62,64,67,69, 72,74,76,79,81, 84]; // C3 - C6

  // Mostly stepwise motion, with the odd small leap, and never a repeat. A
  // uniform random pick over the scale is consonant but sounds aimless;
  // stepwise motion is what makes a line sound intended rather than shuffled.
  const STEPS=[[-3,1],[-2,3],[-1,6],[1,6],[2,3],[3,1]];
  function step(){
    let total=0; for(const e of STEPS) total+=e[1];
    let r=Math.random()*total;
    for(const e of STEPS){ r-=e[1]; if(r<=0) return e[0]; }
    return 1;
  }

  /* Timbre: the original struck singing bowl — inharmonic partials over a long
     decay, each doubled and detuned. Decays sit between the original single
     bowl and the shorter values the chord build needed, since several of these
     ring together but never four at once. */
  const PART=[[1,1,8.0],[2.71,0.40,5.6],[5.14,0.17,4.0],[8.62,0.07,2.6],[12.4,0.03,1.7]];

  function bowl(f,when,gain,pan){
    const bus=ctx.createGain(); bus.gain.value=gain;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; lp.Q.value=.4;
    bus.connect(lp);
    const p=ctx.createStereoPanner?ctx.createStereoPanner():null;
    if(p){ p.pan.value=pan; lp.connect(p); out(p); } else out(lp);
    PART.forEach(function(P){
      const ratio=P[0],amp=P[1],dec=P[2];
      [-0.9,0.9].forEach(function(det){
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=f*ratio; o.detune.value=det*ratio;
        g.gain.setValueAtTime(.0001,when);
        g.gain.exponentialRampToValueAtTime(amp*0.5,when+.02);
        g.gain.exponentialRampToValueAtTime(.0001,when+dec);
        o.connect(g); g.connect(bus); o.start(when); o.stop(when+dec+.2);
      });
    });
  }

  // Rate limit and a ceiling on overlapping notes. Ten fingers land as ten
  // pointerdowns in one frame, and each note is ten oscillators ringing for
  // seconds. Without both, a drum-roll of taps buries the audio thread.
  const GAP=240, MAXACTIVE=16;
  let deg=5, lastAt=-1e9, active=0, first=true;

  function note(nx,ny){
    if(!ctx||muted) return;
    const now=performance.now();
    if(now-lastAt<GAP||active>=MAXACTIVE) return;
    lastAt=now; active++; setTimeout(function(){active--;},8600);

    // Touch height asks for a register, the walk supplies the motion. Blending
    // the two lets the line follow the finger without turning into a keyboard.
    const y=Math.max(0,Math.min(1,ny));
    const want=Math.round((1-y)*(SCALE.length-1));
    if(first){ deg=want; first=false; }
    else{
      let d=deg+step();
      if(Math.abs(d-want)>4) d+=(want>d?2:-2);
      deg=Math.max(0,Math.min(SCALE.length-1,d));
    }

    const pan=Math.max(-1,Math.min(1,(nx-0.5)*1.25));
    bowl(mtof(SCALE[deg]), ctx.currentTime+0.02, 0.185+Math.random()*0.05, pan);
  }

  function start(){
    if(started) return; started=true;
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ started=false; return; }
    if(ctx.state==='suspended'&&ctx.resume) ctx.resume();
    master=ctx.createGain(); master.gain.value=LEVEL;
    comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.02; comp.release.value=.5;
    master.connect(comp); comp.connect(ctx.destination);
    verb=ctx.createConvolver(); verb.buffer=impulse(5.5,2.2);
    wet=ctx.createGain(); wet.gain.value=WET;
    verb.connect(wet); wet.connect(comp);
  }

  // The reverb send bypasses master, so muting has to close both or the tail
  // keeps ringing after the dry signal is gone.
  function toggle(){
    muted=!muted;
    if(ctx){
      master.gain.setTargetAtTime(muted?0:LEVEL, ctx.currentTime, 0.25);
      wet.gain.setTargetAtTime(muted?0:WET, ctx.currentTime, 0.25);
    }
    return muted;
  }

  return { start:start, toggle:toggle, note:note };
})();

const muteBtn=document.getElementById('mute'), sndBox=document.getElementById('snd'),
      wordsBtn=document.getElementById('words'), glyphBox=document.getElementById('glyph');

function flashControls(){
  sndBox.classList.add('live'); clearTimeout(window.__sv);
  window.__sv=setTimeout(function(){sndBox.classList.remove('live');},2200);
}

wordsBtn.onclick=function(){
  wordsOn=!wordsOn;
  wordsBtn.classList.toggle('off',!wordsOn);
  wordsBtn.setAttribute('aria-pressed',String(!wordsOn));
  wordsBtn.setAttribute('aria-label',wordsOn?'Hide words':'Show words');
  glyphBox.classList.toggle('hushed',!wordsOn);
  if(!wordsOn) gt.classList.remove('on');
  flashControls();
};
muteBtn.onclick=()=>{
  const m=Bath.toggle();
  muteBtn.classList.toggle('off',m);
  muteBtn.setAttribute('aria-pressed',String(m));
  muteBtn.setAttribute('aria-label',m?'Unmute':'Mute');
  flashControls();
};

document.getElementById('go').onclick=()=>{
  document.getElementById('gate').classList.add('gone');
  Bath.start();
  sndBox.classList.add('live'); setTimeout(()=>sndBox.classList.remove('live'),4200);
  running=true; t0=last=performance.now();
  requestAnimationFrame(frame);
  cycle();
};
