<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:false});
if(!gl){document.getElementById('gate').innerHTML='<p style="font-family:monospace;color:#EDE6D5">This needs WebGL2.</p>';}

const SIDE = Math.min(innerWidth,innerHeight) < 500 ? 384 : 512;
const N = SIDE*SIDE;

const QUAD=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const NOISE=`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))
        +i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm3(vec3 p){ return snoise(p)*0.58+snoise(p*2.03+11.0)*0.27+snoise(p*4.11+31.0)*0.15; }`;

const SPECTRAL=`
vec3 spectral(float w){
  vec3 c;
  if(w<440.0)      c=vec3(-(w-440.0)/60.0,0.0,1.0);
  else if(w<490.0) c=vec3(0.0,(w-440.0)/50.0,1.0);
  else if(w<510.0) c=vec3(0.0,1.0,-(w-510.0)/20.0);
  else if(w<580.0) c=vec3((w-510.0)/70.0,1.0,0.0);
  else if(w<645.0) c=vec3(1.0,-(w-645.0)/65.0,0.0);
  else             c=vec3(1.0,0.0,0.0);
  float f=1.0;
  if(w<420.0) f=0.30+0.70*(w-380.0)/40.0;
  if(w>700.0) f=0.30+0.70*(720.0-w)/20.0;
  return pow(clamp(c*f,0.0,1.0),vec3(0.85));
}`;

const SIM=`#version 300 es
precision highp float;
uniform sampler2D uPos, uVel;
uniform float uT, uDt, uAspect;
uniform vec3  uPtr[10];
uniform float uPtrN;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;
${NOISE}

vec2 curl(vec2 p, float t){
  float e=0.055;
  return vec2( fbm3(vec3(p.x,p.y+e,t))-fbm3(vec3(p.x,p.y-e,t)),
             -(fbm3(vec3(p.x+e,p.y,t))-fbm3(vec3(p.x-e,p.y,t))) )/(2.0*e);
}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

void main(){
  ivec2 ij=ivec2(gl_FragCoord.xy);
  vec4 s=texelFetch(uPos,ij,0);
  vec4 q=texelFetch(uVel,ij,0);
  vec2 pos=s.xy; float age=s.z, seed=s.w;
  vec2 vel=q.xy; float heat=q.z;

  vec2 d=uv-uP;
  float dl=length(d)+1e-4;
  float push=exp(-dl*5.0)*uOn;

  vec2 bend=vec2(fbm(uv*1.15+t*0.5), fbm(uv*1.15+vec2(4.1,2.7)-t*0.4));
  vec2 guv=uv+(bend-0.5)*(0.010+0.016*uHeat);
  guv+=normalize(d)*push*0.030;
  guv=uP+mat2(cos(push*0.62),-sin(push*0.62),sin(push*0.62),cos(push*0.62))*(guv-uP);

  vec2 wuv=uv+(r-0.5)*(0.026+0.048*uHeat);

  float m=1e9;
  for(int i=0;i<32;i++){
    vec4 S=uSeg[i];
    m=min(m, segd(guv, S.xy, S.zw));
  }

  float core=1.0-smoothstep(0.0,0.0085,m);
  float halo=exp(-m*26.0);
  float mask=clamp(core+halo*0.62,0.0,1.0);
  if(mask<0.006) discard;

  float band=fbm(wuv*2.3+vec2(t*1.7,-t*1.1))+push*0.6+uHeat*0.4+m*3.4;
  vec3 col =spectral(band2w(band*0.95+uT*0.055));
  vec3 col2=spectral(band2w(band*0.48-uT*0.026+0.5));
  col=mix(col,col2,0.42+0.30*sin(uT*0.62+band*3.0));
  col*=0.62+0.85*core+1.1*push;

  gl_FragColor=vec4(col*mask,mask);
}`;

  function csh(t,src){const x=lg.createShader(t);lg.shaderSource(x,src);lg.compileShader(x);return x;}
  const pr=lg.createProgram();
  lg.attachShader(pr,csh(lg.VERTEX_SHADER,LVS));
  lg.attachShader(pr,csh(lg.FRAGMENT_SHADER,LFS));
  lg.linkProgram(pr); lg.useProgram(pr);

  const b=lg.createBuffer();
  lg.bindBuffer(lg.ARRAY_BUFFER,b);
  lg.bufferData(lg.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),lg.STATIC_DRAW);
  const la=lg.getAttribLocation(pr,'p');
  lg.enableVertexAttribArray(la); lg.vertexAttribPointer(la,2,lg.FLOAT,false,0,0);

  const uSeg=lg.getUniformLocation(pr,'uSeg'), uT=lg.getUniformLocation(pr,'uT'),
        uHeat=lg.getUniformLocation(pr,'uHeat'), uP=lg.getUniformLocation(pr,'uP'),
        uOn=lg.getUniformLocation(pr,'uOn');

  lg.enable(lg.BLEND);
  lg.blendFunc(lg.ONE,lg.ONE_MINUS_SRC_ALPHA);
  lg.clearColor(0,0,0,0);

  const V=[];
  for(let i=0;i<16;i++) V.push([(i&1)?1:-1,(i&2)?1:-1,(i&4)?1:-1,(i&8)?1:-1]);
  const E=[];
  for(let i=0;i<16;i++) for(let k=0;k<4;k++){ const j=i^(1<<k); if(j>i) E.push([i,j]); }

  const seg=new Float32Array(32*4);
  function turn(p,i,j,ang){
    const c=Math.cos(ang),s=Math.sin(ang),x=p[i],y=p[j];
    p[i]=x*c-y*s; p[j]=x*s+y*c;
  }
  function project(t){
    const P=[];
    for(let n=0;n<16;n++){
      const p=V[n].slice();
      turn(p,0,3,t*0.31);
      turn(p,1,2,t*0.24);
      turn(p,0,1,t*0.13);
      turn(p,2,3,t*0.19);
      const k4=1.9/(2.9-p[3]);
      let x=p[0]*k4, y=p[1]*k4, z=p[2]*k4;
      const k3=1.75/(3.4-z);
      P.push([0.5+x*k3*0.30, 0.5+y*k3*0.30]);
    }
    for(let e=0;e<32;e++){
      const A=P[E[e][0]], B=P[E[e][1]];
      seg[e*4]=A[0]; seg[e*4+1]=A[1]; seg[e*4+2]=B[0]; seg[e*4+3]=B[1];
    }
  }

  // px/py follow tx/ty rather than snapping to the pointer, so the deformation
  // trails the finger like a fluid instead of teleporting with it.
  let px=0.5,py=0.5,tx=0.5,ty=0.5,on=0,heat=0,held=false,hoverUntil=0;
  function at(e){
    const rc=lc.getBoundingClientRect(); if(!rc.width) return;
    tx=(e.clientX-rc.left)/rc.width;
    ty=1.0-(e.clientY-rc.top)/rc.height;
  }
  lc.addEventListener('pointerdown',e=>{
    held=true; at(e);
    try{ lc.setPointerCapture(e.pointerId); }catch(_){}
  });
  // Hover used to shove `on` up with Math.max every move, which fought the
  // easing and jittered. A decaying deadline lets it ease both ways instead.
  lc.addEventListener('pointermove',e=>{ at(e); if(!held) hoverUntil=performance.now()+420; });
  ['pointerup','pointercancel','lostpointercapture'].forEach(k=>
    lc.addEventListener(k,()=>held=false));

  // Match the backing store to the element's real pixel size. The logo is much
  // larger now, and a fixed 560px canvas upscaled on a 3x phone screen is soft.
  function sizeLogo(){
    const r=lc.getBoundingClientRect(); if(!r.width) return;
    const px2=Math.max(1,Math.round(r.width*Math.min(devicePixelRatio||1,2.5)));
    if(lc.width!==px2){ lc.width=px2; lc.height=px2; }
  }
  sizeLogo();
  addEventListener('resize',()=>{clearTimeout(window.__lr);window.__lr=setTimeout(sizeLogo,180);});
  // The gate is laid out with a webfont; re-measure once it lands.
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(sizeLogo).catch(()=>{});
  setTimeout(sizeLogo,600); setTimeout(sizeLogo,2000);

  // Rotation is INTEGRATED as a phase, not derived from absolute time.
  //
  // The old form was project(t*(1.0+0.55*on)) — it scaled elapsed time by the
  // interaction amount, so the angle depended on a number that grows all
  // session. Easing `on` from 0 to 1 at t=100s swept the argument from 100 to
  // 155, i.e. ~17 radians of extra rotation dumped into half a second. That is
  // the spin-out: it got worse the longer the page had been open, which is why
  // it seemed to happen only sometimes.
  //
  // Integrating means touch changes the RATE and never the accumulated angle,
  // so it can only ever speed up smoothly. dt is clamped for the same reason:
  // a backgrounded tab must not bank up seconds of rotation and spend them in
  // one frame on return.
  const T0=performance.now();
  let phase=0,last=T0;
  (function tick(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    const t=(now-T0)/1000;

    // Frame-rate independent easing, matching the main sim's 1-exp(-dt*k) idiom,
    // so a 120Hz iPhone converges at the same speed as a 60Hz display.
    const target = held ? 1 : (now<hoverUntil ? 0.30 : 0);
    on   += (target-on)       * (1-Math.exp(-dt*9));
    heat += ((held?1:0)-heat) * (1-Math.exp(-dt*2.4));
    px   += (tx-px)           * (1-Math.exp(-dt*13));
    py   += (ty-py)           * (1-Math.exp(-dt*13));

    phase += dt*(1.0+0.55*on);
    project(phase);

    lg.viewport(0,0,lc.width,lc.height);
    lg.clear(lg.COLOR_BUFFER_BIT);
    lg.useProgram(pr);
    lg.uniform4fv(uSeg,seg);
    lg.uniform1f(uT,t); lg.uniform1f(uHeat,heat); lg.uniform1f(uOn,on);
    lg.uniform2f(uP,px,py);
    lg.drawArrays(lg.TRIANGLES,0,3);
    requestAnimationFrame(tick);
  })(performance.now());
})();


const Bath=(function(){
  // One fixed output level. There is no in-page volume any more: the device's
  // own volume is the volume, and the corner bell is purely a mute toggle.
  const LEVEL=0.5;

  let ctx,master,comp,verb,wet,nodes=[],timers=[],started=false,muted=false,
      trim=1,wetLevel=0.42;

  function impulse(sec,decay){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){
      const d=b.getChannelData(c);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
    }
    return b;
  }

  // Pink noise (Paul Kellet's filter). The tail is crossfaded into the head so
  // the buffer can loop forever without a click at the seam.
  function noise(sec){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){
      const d=b.getChannelData(c); let b0=0,b1=0,b2=0;
      for(let i=0;i<n;i++){
        const w=Math.random()*2-1;
        b0=0.99765*b0+w*0.0990460; b1=0.96300*b1+w*0.2965164; b2=0.57000*b2+w*1.0526913;
        d[i]=(b0+b1+b2+w*0.1848)*0.22;
      }
      const x=Math.min(4096,n>>3);
      for(let i=0;i<x;i++){ const a=i/x; d[n-x+i]=d[n-x+i]*(1-a)+d[i]*a; }
    }
    return b;
  }

  function osc(type,freq,det){
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=freq;
    if(det) o.detune.value=det; return o;
  }
  // Everything feeds the dry master and the reverb send in parallel.
  function out(node){ node.connect(master); node.connect(verb); }
  // A very slow LFO onto any AudioParam — the source of all the drift.
  function drift(param,rate,depth,t){
    const l=ctx.createOscillator(), a=ctx.createGain();
    l.frequency.value=rate; a.gain.value=depth;
    l.connect(a); a.connect(param); l.start(t); nodes.push(l);
  }

  /* ---- bowls: the original singing bowls, unchanged in character ---- */
  const PITCH=[130.81,146.83,196.00,220.00,261.63,293.66,392.00];
  const PART=[[1,1,11],[2.71,0.40,8],[5.14,0.17,6],[8.62,0.07,4],[12.4,0.03,2.6]];
  function strike(f,gain){
    const t=ctx.currentTime;
    const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    if(pan) pan.pan.value=(Math.random()*2-1)*0.7;
    const bus=ctx.createGain(); bus.gain.value=gain;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; lp.Q.value=.4;
    bus.connect(lp);
    if(pan){ lp.connect(pan); out(pan); } else { out(lp); }
    PART.forEach(function(P){
      var ratio=P[0],amp=P[1],dec=P[2];
      [-0.9,0.9].forEach(function(det){
        const o=osc('sine',f*ratio,det*ratio), g=ctx.createGain();
        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(amp*0.5,t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+dec);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t+dec+.2);
      });
    });
  }
  function bowls(){
    const t=ctx.currentTime;
    [65.41,98.00,130.81].forEach(function(f,i){
      const o=osc(i?'sine':'triangle',f,(i-1)*3.5), g=ctx.createGain(),
            lp=ctx.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=440-i*90; lp.Q.value=.7;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(0.052/(i+1),t+9);
      drift(g.gain,0.017+i*0.011,0.026/(i+1),t);
      drift(lp.frequency,0.008+i*0.005,130,t);
      o.connect(lp); lp.connect(g); out(g); o.start(t); nodes.push(o);
    });
    (function ring(){
      strike(PITCH[(Math.random()*PITCH.length)|0], 0.16+Math.random()*0.14);
      if(Math.random()<0.28) timers.push(setTimeout(function(){
        strike(PITCH[(Math.random()*4)|0],0.10);
      },900+Math.random()*1400));
      timers.push(setTimeout(ring, 7000+Math.random()*13000));
    })();
  }

  /* ---- Ambient I: low warm drone, no events, just slow breathing ---- */
  function amb1(){
    const t=ctx.currentTime;
    [55.00,82.41,110.00,164.81,220.00].forEach(function(f,i){
      const o=osc(i%2?'sine':'triangle',f,(i-2)*4), g=ctx.createGain(),
            lp=ctx.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=300+i*120; lp.Q.value=.6;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(0.062/(1+i*0.55),t+11);
      drift(g.gain,0.013+i*0.007,0.022/(1+i*0.5),t);
      drift(lp.frequency,0.006+i*0.004,110,t);
      o.connect(lp); lp.connect(g); out(g); o.start(t); nodes.push(o);
    });
  }

  /* ---- Ambient II: airy high bed with sparse crystalline bells ---- */
  function chime(f,gain){
    const t=ctx.currentTime;
    const bus=ctx.createGain(); bus.gain.value=gain;
    const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    if(pan){ pan.pan.value=(Math.random()*2-1)*0.75; bus.connect(pan); out(pan); }
    else out(bus);
    [[1,1,5.5],[2.76,0.30,4.2],[5.40,0.12,3.0],[8.93,0.05,2.0]].forEach(function(P){
      const o=osc('sine',f*P[0],0), g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(P[1]*0.5,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+P[2]);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+P[2]+.2);
    });
  }
  function amb2(){
    const t=ctx.currentTime;
    [523.25,659.25,783.99].forEach(function(f,i){
      const o=osc('sine',f,(i-1)*6), g=ctx.createGain(), bp=ctx.createBiquadFilter();
      bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=2.2;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(0.022/(i+1),t+13);
      drift(g.gain,0.021+i*0.013,0.013/(i+1),t);
      o.connect(bp); bp.connect(g); out(g); o.start(t); nodes.push(o);
    });
    const SCALE=[1046.50,1174.66,1396.91,1567.98,1864.66,2093.00];
    (function ping(){
      chime(SCALE[(Math.random()*SCALE.length)|0], 0.10+Math.random()*0.07);
      timers.push(setTimeout(ping, 2600+Math.random()*5200));
    })();
  }

  /* ---- Ambient III: filtered noise weather over a low rumble ---- */
  function amb3(){
    const t=ctx.currentTime;
    const src=ctx.createBufferSource(); src.buffer=noise(6); src.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=620; bp.Q.value=0.7;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
    const g=ctx.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(0.11,t+8);
    drift(bp.frequency,0.021,340,t);
    drift(g.gain,0.013,0.035,t);
    src.connect(bp); bp.connect(lp); lp.connect(g); out(g); src.start(t); nodes.push(src);
    [41.20,61.74].forEach(function(f,i){
      const o=osc('sine',f,0), og=ctx.createGain(), olp=ctx.createBiquadFilter();
      olp.type='lowpass'; olp.frequency.value=150;
      og.gain.setValueAtTime(.0001,t);
      og.gain.exponentialRampToValueAtTime(0.046/(i+1),t+10);
      drift(og.gain,0.009+i*0.006,0.018/(i+1),t);
      o.connect(olp); olp.connect(og); out(og); o.start(t); nodes.push(o);
    });
  }

  // Reverb size and wet amount are part of each bed's character, and trim
  // evens out perceived loudness so switching modes does not change volume.
  const MODES={
    bowls:{build:bowls, ir:[4.2,2.4], wet:0.42, trim:1.00},
    amb1: {build:amb1,  ir:[5.5,2.2], wet:0.46, trim:0.95},
    amb2: {build:amb2,  ir:[6.5,1.9], wet:0.52, trim:1.05},
    amb3: {build:amb3,  ir:[3.5,2.6], wet:0.30, trim:1.00}
  };

  function start(mode){
    if(started) return;
    const M=MODES[mode]; if(!M) return;      // 'none' and anything unknown: stay silent
    started=true; trim=M.trim; wetLevel=M.wet;
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ started=false; return; }
    if(ctx.state==='suspended' && ctx.resume) ctx.resume();
    master=ctx.createGain(); master.gain.value=LEVEL*trim;
    comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.02; comp.release.value=.5;
    master.connect(comp); comp.connect(ctx.destination);
    verb=ctx.createConvolver(); verb.buffer=impulse(M.ir[0],M.ir[1]);
    wet=ctx.createGain(); wet.gain.value=wetLevel;
    verb.connect(wet); wet.connect(comp);
    M.build();
  }

  // The reverb send bypasses master, so muting has to close both or the tail
  // keeps ringing after the dry signal is gone.
  function toggle(){
    muted=!muted;
    if(ctx){
      master.gain.setTargetAtTime(muted?0:LEVEL*trim, ctx.currentTime, 0.25);
      wet.gain.setTargetAtTime(muted?0:wetLevel, ctx.currentTime, 0.25);
    }
    return muted;
  }

  return { start:start, toggle:toggle };
})();

const muteBtn=document.getElementById('mute'), sndBox=document.getElementById('snd');
muteBtn.onclick=()=>{
  const m=Bath.toggle();
  muteBtn.classList.toggle('off',m);
  muteBtn.setAttribute('aria-pressed',String(m));
  muteBtn.setAttribute('aria-label',m?'Unmute':'Mute');
  sndBox.classList.add('live'); clearTimeout(window.__sv);
  window.__sv=setTimeout(()=>sndBox.classList.remove('live'),2200);
};

// Mirror :checked onto the label so the chip can be styled without :has().
const picks=Array.prototype.slice.call(document.querySelectorAll('#snd-pick input'));
function syncPicks(){ picks.forEach(p=>p.parentNode.classList.toggle('on',p.checked)); }
picks.forEach(p=>p.addEventListener('change',syncPicks));
syncPicks();

document.getElementById('go').onclick=()=>{
  const sel=document.querySelector('#snd-pick input:checked');
  const mode=sel?sel.value:'bowls';
  document.getElementById('gate').classList.add('gone');
  if(mode==='none'){
    // Nothing to mute, so do not offer a mute control.
    sndBox.hidden=true;
  }else{
    Bath.start(mode);
    sndBox.classList.add('live'); setTimeout(()=>sndBox.classList.remove('live'),4200);
  }
  running=true; t0=last=performance.now();
  requestAnimationFrame(frame);
  cycle();
};
