<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:false});
if(!gl){document.getElementById('gate').innerHTML='<p style="font-family:monospace;color:#EDE6D5">This needs WebGL2.</p>';}

const SIDE = Math.min(innerWidth,innerHeight) < 500 ? 384 : 512;
const N = SIDE*SIDE;

const QUAD=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const NOISE=`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))
        +i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm3(vec3 p){ return snoise(p)*0.58+snoise(p*2.03+11.0)*0.27+snoise(p*4.11+31.0)*0.15; }`;

const SPECTRAL=`
vec3 spectral(float w){
  vec3 c;
  if(w<440.0)      c=vec3(-(w-440.0)/60.0,0.0,1.0);
  else if(w<490.0) c=vec3(0.0,(w-440.0)/50.0,1.0);
  else if(w<510.0) c=vec3(0.0,1.0,-(w-510.0)/20.0);
  else if(w<580.0) c=vec3((w-510.0)/70.0,1.0,0.0);
  else if(w<645.0) c=vec3(1.0,-(w-645.0)/65.0,0.0);
  else             c=vec3(1.0,0.0,0.0);
  float f=1.0;
  if(w<420.0) f=0.30+0.70*(w-380.0)/40.0;
  if(w>700.0) f=0.30+0.70*(720.0-w)/20.0;
  return pow(clamp(c*f,0.0,1.0),vec3(0.85));
}`;

const SIM=`#version 300 es
precision highp float;
uniform sampler2D uPos, uVel;
uniform float uT, uDt, uAspect;
uniform vec3  uPtr[10];
uniform float uPtrN;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;
${NOISE}

vec2 curl(vec2 p, float t){
  float e=0.055;
  return vec2( fbm3(vec3(p.x,p.y+e,t))-fbm3(vec3(p.x,p.y-e,t)),
             -(fbm3(vec3(p.x+e,p.y,t))-fbm3(vec3(p.x-e,p.y,t))) )/(2.0*e);
}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

void main(){
  ivec2 ij=ivec2(gl_FragCoord.xy);
  vec4 s=texelFetch(uPos,ij,0);
  vec4 q=texelFetch(uVel,ij,0);
  vec2 pos=s.xy; float age=s.z, seed=s.w;
  vec2 vel=q.xy; float heat=q.z;

  vec2 target = curl(pos*0.38, uT*0.0135)*0.050              + curl(pos*1.05+17.0, uT*0.026)*0.013;
  float gain=0.0;
  for(int i=0;i<10;i++){
    if(float(i)>=uPtrN) break;
    vec3 P=uPtr[i]; if(P.z<=0.0) continue;
    vec2 d=pos-P.xy; float dl=length(d)+1e-5;

    float reach=2.0+5.2*(1.0-P.z);
    float f=exp(-dl*reach);
    float pw=0.16+1.35*P.z*P.z;
    vec2 tang=vec2(-d.y,d.x)/dl;
    target += tang*f*pw*2.30;    target += curl(pos*3.4+float(i)*9.0, uT*0.11)*f*pw*1.25;    target -= d/dl*f*pw*0.10;    gain   += f*pw;
  }

  heat += gain*uDt*2.6;
  heat *= exp(-uDt*0.20);  heat  = min(heat,1.5);

  vel = mix(vel, target, 1.0-exp(-uDt*1.25));

  pos += vel*uDt;
  age += uDt*(0.0165+0.013*seed);

  if(age>1.0 || abs(pos.x)>uAspect*1.35 || abs(pos.y)>1.35){
    float k=hash(vec2(seed*137.0, floor(uT*0.37)+float(ij.x*7+ij.y)));
    float a=hash(vec2(k,3.1))*6.2831, r=sqrt(hash(vec2(k,7.7)))*1.15;
    pos=vec2(cos(a)*r*uAspect, sin(a)*r);
    age=hash(vec2(k,9.3))*0.25; vel=vec2(0.0); heat=0.0;
  }
  oPos=vec4(pos,age,seed);
  oVel=vec4(vel,heat,0.0);
}`;

const PVS=`#version 300 es
precision highp float;
uniform sampler2D uPos, uVel;
uniform float uSide, uAspect, uT, uPx;
out vec4 vCol;
${NOISE}
${SPECTRAL}
void main(){
  int side=int(uSide);
  ivec2 ij=ivec2(gl_VertexID%side, gl_VertexID/side);
  vec4 s=texelFetch(uPos,ij,0);
  vec4 q=texelFetch(uVel,ij,0);
  vec2 pos=s.xy; float age=s.z, seed=s.w, heat=q.z;

  gl_Position=vec4(pos.x/uAspect,pos.y,0.0,1.0);

  float band=fbm3(vec3(pos*0.30, uT*0.0062+seed*0.05));
  float base=fract(band*0.5+0.5+seed*0.07+uT*0.0011);
  float w=398.0+306.0*pow(fract(base+heat*0.78),1.22);

  float fade=sin(3.14159*clamp(age,0.0,1.0));
  float glow=1.0+2.2*heat;
  vCol=vec4(spectral(w), fade*(0.22+0.40*seed)*glow);
  gl_PointSize=uPx*(0.75+1.35*seed)*(0.55+0.75*fade)*(1.0+1.5*heat);
}`;

const PFS=`#version 300 es
precision highp float;
in vec4 vCol; out vec4 o;
void main(){
  vec2 d=gl_PointCoord-0.5;
  float r=dot(d,d)*4.0;
  if(r>1.0) discard;
  o=vec4(vCol.rgb*vCol.a*pow(1.0-r,2.4)*0.24,1.0);

    const P=[];
    for(let n=0;n<16;n++){
      const p=V[n].slice();
      turn(p,0,3,t*0.31);
      turn(p,1,2,t*0.24);
      turn(p,0,1,t*0.13);
      turn(p,2,3,t*0.19);
      const k4=1.9/(2.9-p[3]);
      let x=p[0]*k4, y=p[1]*k4, z=p[2]*k4;
      const k3=1.75/(3.4-z);
      P.push([0.5+x*k3*0.30, 0.5+y*k3*0.30]);
    }
    for(let e=0;e<32;e++){
      const A=P[E[e][0]], B=P[E[e][1]];
      seg[e*4]=A[0]; seg[e*4+1]=A[1]; seg[e*4+2]=B[0]; seg[e*4+3]=B[1];
    }
  }

  let px=0.5,py=0.5,on=0,heat=0,held=false;
  function at(e){
    const rc=lc.getBoundingClientRect();
    px=(e.clientX-rc.left)/rc.width;
    py=1.0-(e.clientY-rc.top)/rc.height;
  }
  lc.addEventListener('pointerdown',e=>{held=true;at(e);lc.setPointerCapture(e.pointerId);});
  lc.addEventListener('pointermove',e=>{at(e); if(!held) on=Math.max(on,0.30);});
  ['pointerup','pointercancel','pointerleave'].forEach(k=>lc.addEventListener(k,()=>held=false));

  const t0=performance.now();
  (function tick(now){
    const t=(now-t0)/1000;
    on  += ((held?1:0)-on)*0.16;
    heat+= ((held?1:0)-heat)*0.045;
    project(t*(1.0+0.55*on));
    lg.viewport(0,0,lc.width,lc.height);
    lg.clear(lg.COLOR_BUFFER_BIT);
    lg.useProgram(pr);
    lg.uniform4fv(uSeg,seg);
    lg.uniform1f(uT,t); lg.uniform1f(uHeat,heat); lg.uniform1f(uOn,on);
    lg.uniform2f(uP,px,py);
    lg.drawArrays(lg.TRIANGLES,0,3);
    requestAnimationFrame(tick);
  })(performance.now());
})();


const Bath=(function(){
  let ctx,master,wet,verb,drone=[],timer,started=false,muted=false,level=0.55;

  function impulse(sec,decay){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){
      const d=b.getChannelData(c);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
    }
    return b;
  }

  const PITCH=[130.81,146.83,196.00,220.00,261.63,293.66,392.00];
  const PART=[[1,1,11],[2.71,0.40,8],[5.14,0.17,6],[8.62,0.07,4],[12.4,0.03,2.6]];

  function strike(f,gain){
    const t=ctx.currentTime;
    const pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    if(pan) pan.pan.value=(Math.random()*2-1)*0.7;
    const bus=ctx.createGain(); bus.gain.value=gain;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; lp.Q.value=.4;
    bus.connect(lp);
    if(pan){ lp.connect(pan); pan.connect(master); pan.connect(verb); }
    else { lp.connect(master); lp.connect(verb); }

    PART.forEach(([ratio,amp,dec])=>{
      [-0.9,0.9].forEach(det=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=f*ratio; o.detune.value=det*ratio;
        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(amp*0.5,t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,t+dec);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t+dec+.2);
      });
    });
  }

  function schedule(){
    const f=PITCH[(Math.random()*PITCH.length)|0];
    strike(f, 0.16+Math.random()*0.14);
    if(Math.random()<0.28) setTimeout(()=>strike(PITCH[(Math.random()*4)|0],0.10),900+Math.random()*1400);
    timer=setTimeout(schedule, 7000+Math.random()*13000);
  }

  function bed(){
    const t=ctx.currentTime;
    [65.41,98.00,130.81].forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
      o.type=i?'sine':'triangle'; o.frequency.value=f; o.detune.value=(i-1)*3.5;
      lp.type='lowpass'; lp.frequency.value=440-i*90; lp.Q.value=.7;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(0.052/(i+1),t+9);
      const lfo=ctx.createOscillator(), la=ctx.createGain();
      lfo.frequency.value=0.017+i*0.011; la.gain.value=0.026/(i+1);
      lfo.connect(la); la.connect(g.gain); lfo.start(t);
      const flfo=ctx.createOscillator(), fa=ctx.createGain();
      flfo.frequency.value=0.008+i*0.005; fa.gain.value=130;
      flfo.connect(fa); fa.connect(lp.frequency); flfo.start(t);
      o.connect(lp); lp.connect(g); g.connect(master); g.connect(verb);
      o.start(t); drone.push(o,lfo,flfo);
    });
  }

  function start(){
    if(started) return; started=true;
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    master=ctx.createGain(); master.gain.value=level;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.02; comp.release.value=.5;
    master.connect(comp); comp.connect(ctx.destination);
    verb=ctx.createConvolver(); verb.buffer=impulse(4.2,2.4);
    wet=ctx.createGain(); wet.gain.value=0.42;
    verb.connect(wet); wet.connect(comp);
    bed();
    setTimeout(schedule,3500);
  }

  function apply(){
    if(!master) return;
    master.gain.setTargetAtTime(muted?0:level, ctx.currentTime, 0.25);
    if(wet) wet.gain.setTargetAtTime(muted?0:0.42, ctx.currentTime, 0.25);
  }
  return {
    start,
    setLevel(v){ level=v; apply(); },
    toggle(){ muted=!muted; apply(); return muted; }
  };
})();

const muteBtn=document.getElementById('mute'), volEl=document.getElementById('vol'), sndBox=document.getElementById('snd');
muteBtn.onclick=()=>{
  const m=Bath.toggle();
  muteBtn.classList.toggle('off',m);
  muteBtn.innerHTML=m?'&#9678;':'&#9673;';
  sndBox.classList.add('live'); setTimeout(()=>sndBox.classList.remove('live'),2200);
};
volEl.oninput=()=>{
  Bath.setLevel(volEl.value/100);
  sndBox.classList.add('live'); clearTimeout(window.__sv);
  window.__sv=setTimeout(()=>sndBox.classList.remove('live'),2200);
};

document.getElementById('go').onclick=()=>{
  document.getElementById('gate').classList.add('gone');
  Bath.start();
  sndBox.classList.add('live'); setTimeout(()=>sndBox.classList.remove('live'),4200);
  running=true; t0=last=performance.now();
  requestAnimationFrame(frame);
  cycle();
};
</script>
